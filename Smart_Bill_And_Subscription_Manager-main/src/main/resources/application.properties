spring.application.name=Smart_Bill_And_Subscription_Manager

# Server Port (Render provides port via $PORT, defaults to 8080 locally)
server.port=${PORT:8080}

# Frontend CORS URL (configured in Render environment variables)
frontend.url=${FRONTEND_URL:}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Database (PostgreSQL / Neon DB) - Supports DATABASE_URL or SPRING_DATASOURCE_URL
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# HikariCP Connection Pool (Optimized for Neon DB Serverless & Cloud)
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=25000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=0

# Mail (SMTP & Brevo HTTPS REST API)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:${SPRING_MAIL_USERNAME:smartadmin4@gmail.com}}
spring.mail.password=${MAIL_APP_PASSWORD:${SPRING_MAIL_PASSWORD}}
brevo.api.key=${BREVO_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com